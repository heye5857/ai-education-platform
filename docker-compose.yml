version: '3.8'

services:
  # PostgreSQL 16 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-edu-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_edu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ai_edu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: ai-edu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 可選：PgAdmin (資料庫管理 UI) - 使用 profiles 控制
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-edu-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ai-edu.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data: